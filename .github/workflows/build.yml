name: Build check

# Controleert bij elke push en pull request of de app foutloos bouwt,
# zodat een kapotte wijziging nooit ongemerkt naar productie gaat.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
