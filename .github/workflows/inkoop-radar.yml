name: Inkoop-radar

# Haalt dagelijks nieuwe (particuliere) motoradvertenties op van 2dehands.be,
# slaat nieuwe leads op in Supabase en mailt een digest via Resend.
# Handmatig testen kan via de "Run workflow"-knop (workflow_dispatch).

on:
  schedule:
    - cron: "0 5 * * *"   # ~07:00 Europe/Brussel
  workflow_dispatch:
    inputs:
      keyword:
        description: "Extra zoekterm binnen categorie Motoren (optioneel)"
        required: false
        default: ""
      max_items:
        description: "Max. aantal advertenties"
        required: false
        default: "150"
      modus:
        description: "normaal = echte run; alleen-prijzen = oude leads aanvullen + verkoopdoelen (niet ophalen/opruimen/mailen); diagnose = dry-run die alleen logt"
        required: false
        type: choice
        options: [normaal, alleen-prijzen, diagnose, diagnose-voorraad]
        default: normaal
      test_model:
        description: "Prijstest: model als 'Merk Model' (bijv. Kawasaki Z900)"
        required: false
        default: "Kawasaki Z900"
      test_bouwjaar:
        description: "Prijstest: bouwjaar"
        required: false
        default: "2020"
      test_km:
        description: "Prijstest: km-stand"
        required: false
        default: "20000"

concurrency:
  group: motoroccasion   # gedeeld: inkoop-radar en voorraad-prijscheck nooit tegelijk
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r inkoop-radar/requirements.txt
      - name: Run inkoop-radar
        if: ${{ !startsWith(github.event.inputs.modus, 'diagnose') && github.event.inputs.modus != 'alleen-prijzen' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # Configureerbare filters — repo-variables (Settings → Variables) met veilige defaults.
          RADAR_KEYWORD: ${{ github.event.inputs.keyword || vars.RADAR_KEYWORD }}
          RADAR_PRICE_MIN: ${{ vars.RADAR_PRICE_MIN || '0' }}
          RADAR_PRICE_MAX: ${{ vars.RADAR_PRICE_MAX || '8000' }}
          RADAR_MAX_ITEMS: ${{ github.event.inputs.max_items || vars.RADAR_MAX_ITEMS || '150' }}
          RADAR_L1_CATEGORY: ${{ vars.RADAR_L1_CATEGORY || '678' }}
          RADAR_SEARCH_URL: ${{ vars.RADAR_SEARCH_URL || 'https://www.2dehands.be/lrp/api/search' }}
          RADAR_BRON: ${{ vars.RADAR_BRON || '2dehands' }}
          RADAR_MO_MAX: ${{ vars.RADAR_MO_MAX || '40' }}
        run: python inkoop-radar/fetch_leads.py
      - name: Alleen prijzen (oude leads aanvullen + verkoopdoelen; geen ophalen/opruimen/mail)
        if: ${{ github.event.inputs.modus == 'alleen-prijzen' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RADAR_L1_CATEGORY: ${{ vars.RADAR_L1_CATEGORY || '678' }}
          RADAR_SEARCH_URL: ${{ vars.RADAR_SEARCH_URL || 'https://www.2dehands.be/lrp/api/search' }}
          RADAR_BRON: ${{ vars.RADAR_BRON || '2dehands' }}
          RADAR_MO_MAX: ${{ vars.RADAR_MO_MAX || '40' }}
        run: python inkoop-radar/fetch_leads.py --alleen-prijzen
      - name: Diagnose (dry-run — schrijft niets weg, stuurt geen mail)
        if: ${{ startsWith(github.event.inputs.modus, 'diagnose') }}
        env:
          # Alleen om leads te LEZEN voor de droogtest; diagnose.py schrijft niets.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_MODEL: ${{ github.event.inputs.test_model }}
          TEST_BOUWJAAR: ${{ github.event.inputs.test_bouwjaar }}
          TEST_KM: ${{ github.event.inputs.test_km }}
          ALLEEN_VOORRAAD: ${{ github.event.inputs.modus == 'diagnose-voorraad' && '1' || '0' }}
        run: python inkoop-radar/diagnose.py
